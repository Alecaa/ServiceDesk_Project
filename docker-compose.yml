services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: backend_app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./app:/code/app
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../servicedesk-frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "4200:4200"   #Angular dev server
    volumes:
      - ../servicedesk-frontend:/app   #conecta tu código local
      - /app/node_modules              #evita conflictos
    environment:
      - CHOKIDAR_USEPOLLING=true       #necesario en Windows
    command: npm start                 #usa ng serve
    depends_on:
      - backend
    restart: "no"

volumes:
  mysql_data: